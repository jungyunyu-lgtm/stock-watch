name: stock-watch

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "디스코드 연결 테스트만 실행"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stock-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Check stock
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python check_stock.py --test
          else
            python check_stock.py
          fi

      - name: Save state
        if: ${{ !inputs.test }}
        run: |
          git config user.name "stock-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          [ -f state.json ] && git add state.json
          git diff --cached --quiet || git commit -m "update state"
          git push
